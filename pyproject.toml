[project]
name = "microservice-evolution"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.143.0",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.1.4",
    "uuid-utils>=1.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["api"]
testpaths = ["api/tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D1"]

[tool.ruff.lint.per-file-ignores]
"api/tests/*" = ["D101", "D102", "D103", "D105", "D107"]

[tool.ty.environment]
extra-paths = ["api"]
