# Postgres só para testes: porta 5433, dados em memória (tmpfs), separado do banco de desenvolvimento.
# Uso: make test-db (o `make test` já sobe sozinho).
name: microservice-evolution-test
services:
  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app_test
    ports:
      - "5433:5432"
    # Sem volume: descartável e rápido.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_test"]
      interval: 1s
      timeout: 3s
      retries: 20
