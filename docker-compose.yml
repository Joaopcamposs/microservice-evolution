# Ambiente local: API + Postgres + Grafana (observabilidade). As tabelas são criadas pela API na subida.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Grafana + Tempo (traces) + Prometheus (métricas) + Loki (logs) + coletor OTLP num container.
  # Grafana em http://localhost:3000 (admin/admin); a API envia OTLP/HTTP na porta 4318.
  otel:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"
      - "4318:4318"
    volumes:
      - otel-data:/data
      # Dashboards versionados: o provider aponta para a pasta montada abaixo.
      - ./observability/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/orders.yaml:ro
      - ./observability/dashboards:/orders-dashboards:ro

  # API; só inicia com o Postgres saudável.
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/app
      # Ajustáveis na linha de comando: WEB_CONCURRENCY=4 DB_POOL_SIZE=20 make bench
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      # OpenTelemetry nativo do FastAPI: exporta traces, métricas e logs via OTLP para o `otel`.
      # Desligar: FASTAPI_OTEL_AUTO_CONFIGURE=false docker compose up -d api
      FASTAPI_OTEL_AUTO_CONFIGURE: ${FASTAPI_OTEL_AUTO_CONFIGURE:-true}
      OTEL_SERVICE_NAME: orders-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
      # Amostragem: 1.0 = todos os traces. Reduza (ex.: 0.1) sob carga.
      OTEL_TRACES_SAMPLER: parentbased_traceidratio
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      # Cobrança e e-mail fake: latência média (ms, ±40%) e taxa de falha (0 a 1).
      CHARGE_LATENCY_MS: ${CHARGE_LATENCY_MS:-600}
      CHARGE_FAILURE_RATE: ${CHARGE_FAILURE_RATE:-0.1}
      EMAIL_LATENCY_MS: ${EMAIL_LATENCY_MS:-200}
      EMAIL_FAILURE_RATE: ${EMAIL_FAILURE_RATE:-0.05}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Carga com k6 (só sobe com o perfil `bench`): docker compose run --rm k6, ou make bench.
  k6:
    image: grafana/k6:latest
    profiles: [bench]
    volumes:
      - ./bench:/bench:ro
    command: ["run", "--summary-trend-stats=avg,p(50),p(95),p(99),max", "/bench/orders.js"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  otel-data:
